name: Problema no site
description: Relate um erro técnico ou visual.
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: descricao
    attributes:
      label: O que aconteceu?
    validations:
      required: true
  - type: textarea
    id: esperado
    attributes:
      label: O que você esperava?
    validations:
      required: true
  - type: input
    id: navegador
    attributes:
      label: Navegador/dispositivo
